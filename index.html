  var pendingEpicenter = null;
  /* 專案決定震央的流程：
       1. 點地圖→震源X/Y→「座標変換」→經緯度寫入震源列表第 1、2 格
       2. 列表長度 > 8 時「震源決定された」會改為 true
       3. 「決定後の処理」等待該值與現在時間差 < 0.1 秒
     因此不依賴模擬點擊（一次點擊就會新增一筆震源），
     而是直接寫入列表並維持開啟那個開關。 */
  function sprite(name) {
    var targets = window.vm && window.vm.runtime && window.vm.runtime.targets;
    return targets ? targets.find(function(t) { return t.getName && t.getName() === name; }) : null;
  }
  /* 地圖中心座標（專案 7-センターX/Y 單位） */
  function projectX(lon) {
    return (((lon + 44) % 360) - 180) * 10;
  }
  function projectY(lat) {
    var rad = (45 + lat / 2) * Math.PI / 180;
    return Math.log(Math.tan(rad)) * 572.9577951308232 - 374.04780730560344;
  }
  /* 寫入震源列表：構位順序為 1=緯度、2=經度、3=深さ、4=マグニチュード */
  function markEpicenter(lat, lon, name) {
    var s = stage();
    if(!s) return false;
    var list = s.variables[LID.epicenter];
    if(!list || !list.value) return false;
    var v = list.value;
    /* 填充到 8 格（>7），讓專案的「処理」判斷為已確定 */
    while(v.length < 8) v.push('');
    v[0] = lat;
    v[1] = lon;
    v[2] = parseInt(slideD.value, 10);
    v[3] = parseFloat(slideM.value);
    /* 設定 lookX/lookY（經度/緯度）供名稱查詢 */
    if(s.variables[VID.lookX]) s.variables[VID.lookX].value = lon;
    if(s.variables[VID.lookY]) s.variables[VID.lookY].value = lat;
    /* 設定 #決定された = 2，讓「処理」的 et 條件滿足 */
    if(s.variables['acWILl7zJAQioxeJQ3Xf']) s.variables['acWILl7zJAQioxeJQ3Xf'].value = 2;
    /* 直接設定震央名稱 */
    if(name && s.variables[VID.epi1]) s.variables[VID.epi1].value = name;
    /* 廣播震央讓專案自己查地名 */
    try {
      if(window.vm && window.vm.runtime) {
        window.vm.runtime.startHats('event_whenbroadcastreceived', { BROADCAST_OPTION: '震央' });
      }
    } catch(e) {}
    return true;
  }
  /* 開啟該專案的「震源決定された」（在実際の震源情報 sprite 上） */
  function openDecided() {
    var src = sprite('実際の震源情報');
    if(src && src.variables && src.variables[VID.decided]) {
      src.variables[VID.decided].value = true;
      return true;
    }
    return false;
  }
  /* 專案的「処理」每帧可能重置門關，在列表維持 8 格期間持續打開它 */
  function holdEpicenter() {
    if(!pendingEpicenter) return;
    var s = stage();
    if(!s) return;
    var list = s.variables[LID.epicenter];
    if(!list || !list.value || list.value.length < 8) return;
    var v = list.value;
    /* 維持經緯度，避免被專案覆寫 */
    v[0] = pendingEpicenter.lat;
    v[1] = pendingEpicenter.lon;
    v[2] = parseInt(slideD.value, 10);
    v[3] = parseFloat(slideM.value);
    if(s.variables[VID.lookX]) s.variables[VID.lookX].value = pendingEpicenter.lon;
    if(s.variables[VID.lookY]) s.variables[VID.lookY].value = pendingEpicenter.lat;
    /* 維持 #決定された = 2 */
    if(s.variables['acWILl7zJAQioxeJQ3Xf']) s.variables['acWILl7zJAQioxeJQ3Xf'].value = 2;
    if(pendingEpicenter.name && s.variables[VID.epi1]) s.variables[VID.epi1].value = pendingEpicenter.name;
    openDecided();
  }
  function focusEpicenter(lat, lon, name) {
    var s = stage();
    if(!s) return;
    pendingEpicenter = { lat: lat, lon: lon, name: name || '' };
    if(s.variables[VID.cx]) s.variables[VID.cx].value = projectX(lon);
    if(s.variables[VID.cy]) s.variables[VID.cy].value = projectY(lat);
    if(s.variables[VID.zoom]) s.variables[VID.zoom].value = 4;
    markEpicenter(lat, lon, name);
    openDecided();
  }
  if(presetSel) presetSel.addEventListener('change', function() {
    var key = presetSel.value;
    presetSel.value = '';
    var obj = PRESETS[key];
    if(!obj) return;
    if(applySettings(obj)) {
      focusEpicenter(obj.lat, obj.lon, obj.name);
      showToast(t('toastPreset'));
    }
  });

  function legacyCopy(str) {
    try {
      var ta = document.createElement('textarea');
      ta.value = str;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch(e) { return false; }
  }
  function copyText(str, okMsg, ngMsg) {
    if(navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(str).then(
        function() { showToast(okMsg); },
        function() { showToast(legacyCopy(str) ? okMsg : ngMsg); }
      );
    } else {
      showToast(legacyCopy(str) ? okMsg : ngMsg);
    }
  }
  function shareUrl() {
    var base = location.origin + location.pathname;
    var url = base + '?m=' + parseFloat(slideM.value).toFixed(1) +
      '&d=' + parseInt(slideD.value, 10) +
      '&t=' + parseInt(slideT.value, 10);
    if(pendingEpicenter) {
      url += '&lat=' + pendingEpicenter.lat + '&lon=' + pendingEpicenter.lon;
      if(pendingEpicenter.name) url += '&name=' + encodeURIComponent(pendingEpicenter.name);
    }
    return url;
  }
  if(btnShare) btnShare.addEventListener('click', function() {
    copyText(shareUrl(), t('toastCopied'), t('toastCopyFail'));
  });

  var langSel = document.getElementById('sim-lang-select');
  if(langSel) langSel.addEventListener('change', function() {
    if(!I18N[langSel.value]) return;
    lang = langSel.value;
    try { localStorage.setItem(LANG_KEY, lang); } catch(e) {}
    applyLang();
  });
  var pageTabs = document.querySelectorAll('.sim-tab');
  for(var pi = 0; pi < pageTabs.length; pi++) {
    (function(tab) {
      tab.addEventListener('click', function() {
        var page = tab.getAttribute('data-page');
        var tabs = document.querySelectorAll('.sim-tab');
        var pages = document.querySelectorAll('.sim-page');
        for(var i = 0; i < tabs.length; i++) tabs[i].classList.toggle('active', tabs[i] === tab);
        for(var j = 0; j < pages.length; j++) pages[j].classList.toggle('active', pages[j].getAttribute('data-page') === page);
      });
    })(pageTabs[pi]);
  }

  function pause() {
    try{ if(window.vm.runtime.pause) window.vm.runtime.pause(); }catch(e){}
    paused=true; btnPause.innerHTML=PLAY_ICON; btnPause.classList.add('paused');
  }
  function resume() {
    try{ if(window.vm.runtime.resume) window.vm.runtime.resume(); }catch(e){}
    paused=false; btnPause.innerHTML=PAUSE_ICON; btnPause.classList.remove('paused');
  }

  function numOr(v, fallback) {
    var n = parseFloat(v);
    return isFinite(n) ? n : fallback;
  }

  function pullVars() {
    var s = stage(); if(!s) return;

    /* sliders – only update when not actively dragging */
    if(document.activeElement!==slideM && s.variables[VID.m])
      slideM.value = Math.min(12, Math.max(1, numOr(s.variables[VID.m].value, 5)));
    if(document.activeElement!==slideD && s.variables[VID.d])
      slideD.value = Math.min(1000, Math.max(0, numOr(s.variables[VID.d].value, 10)));
    if(document.activeElement!==slideT && s.variables[VID.t])
      slideT.value = Math.min(300, Math.max(0, numOr(s.variables[VID.t].value, 0)));
    syncLabels();

    /* 震央 – try ep2 (震源) first, fall back to ep1 */
    var epText = getVar(VID.ep2) || getVar(VID.ep1) || null;
    epiVal.textContent = epText ? String(epText) : '—';

    /* 経過秒 – スタート後発生秒数 */
    var ela = getVar(VID.ela);
    elapsedVal.textContent = (ela !== null && ela !== '' && Number(ela) > 0)
      ? Math.round(Number(ela)) + ' ' + t('sec')
      : '—';
  }

  function hideMonitors() {
    document.querySelectorAll('.sc-monitor-root').forEach(function(el){
      el.style.setProperty('display','none','important');
    });
  }

  /* Estimated epicenter overlay: shown only while an EEW is active. */
  function updateEEWOverlay() {
    if (!eewOverlay) return;
    var active = Number(getVar(VID.eew)) > 0;
    var txt = getVar(VID.ep2);
    if (txt === null || txt === undefined || String(txt).trim() === '') txt = getVar(VID.ep1);
    if (!active || txt === null || txt === undefined || String(txt).trim() === '') {
      eewOverlay.style.display = 'none';
      return;
    }
    var canvas = document.querySelector('.sc-canvas') || document.querySelector('canvas');
    if (!canvas) { eewOverlay.style.display = 'none'; return; }
    var r = canvas.getBoundingClientRect();
    if (!r.width || !r.height) { eewOverlay.style.display = 'none'; return; }
    var s = r.width / 480;
    eewOverlay.textContent = String(txt);
    eewOverlay.style.left = (r.left + 43 * s) + 'px';
    eewOverlay.style.top = (r.top + 13 * s) + 'px';
    eewOverlay.style.fontSize = (16 * s) + 'px';
    eewOverlay.style.padding = (2 * s) + 'px ' + (6 * s) + 'px';
    eewOverlay.style.display = 'block';
  }

  function fixJMA() {
    var s=stage(); if(!s) return;
    var el=s.variables[LID.epicenter], jl=s.variables[LID.jma];
    if(!el||!jl||!el.value||!jl.value) return;
    var N=Math.floor(el.value.length/7), need=N*4;
    while(jl.value.length<need) jl.value.push('');
  }

  function currentSettings() {
    var s = {
      magnitude: parseFloat(slideM.value),
      depthKm: parseInt(slideD.value, 10),
      startOffsetSec: parseInt(slideT.value, 10)
    };
    if(pendingEpicenter) {
      s.lat = pendingEpicenter.lat;
      s.lon = pendingEpicenter.lon;
      s.name = pendingEpicenter.name;
    }
    return s;
  }
  function applySettings(s) {
    var m = numOr(s.magnitude, NaN), d = numOr(s.depthKm, NaN), t = numOr(s.startOffsetSec, NaN);
    if(!isFinite(m) || !isFinite(d) || !isFinite(t)) return false;
    slideM.value = Math.min(12, Math.max(1, m));
    slideD.value = Math.min(1000, Math.max(0, d));
    slideT.value = Math.min(300, Math.max(0, t));
    setVar(VID.m, parseFloat(slideM.value));
    setVar(VID.d, parseInt(slideD.value, 10));
    setVar(VID.t, parseInt(slideT.value, 10));
    syncLabels();
    return true;
  }
  function settingsFromUrl() {
    var q;
    try { q = new URLSearchParams(location.search); } catch(e) { return null; }
    if(!q.has('m') && !q.has('d') && !q.has('t') && !q.has('lat') && !q.has('lon')) return null;
    return {
      magnitude: q.has('m') ? parseFloat(q.get('m')) : parseFloat(slideM.value),
      depthKm: q.has('d') ? parseFloat(q.get('d')) : parseInt(slideD.value, 10),
      startOffsetSec: q.has('t') ? parseFloat(q.get('t')) : parseInt(slideT.value, 10),
      lat: q.has('lat') ? parseFloat(q.get('lat')) : NaN,
      lon: q.has('lon') ? parseFloat(q.get('lon')) : NaN,
      name: q.get('name') || ''
    };
  }
  function stamp() {
    var d = new Date(), p = function(n){ return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes());
  }

  if(btnExport) btnExport.addEventListener('click', function() {
    var data = {
      app: 'JapanEewSimulator',
      format: 1,
      savedAt: new Date().toISOString(),
      settings: currentSettings()
    };
    var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'eew-sim-' + stamp() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    showToast(t('toastSaved'));
  });
  if(btnImport) btnImport.addEventListener('click', function() { if(fileInput) fileInput.click(); });
  if(fileInput) fileInput.addEventListener('change', function() {
    var f = fileInput.files && fileInput.files[0];
    if(!f) return;
    var rd = new FileReader();
    rd.onload = function() {
      var data;
      try { data = JSON.parse(String(rd.result)); }
      catch(e) { showToast(t('toastBadJson')); return; }
      var s = (data && data.settings) ? data.settings : data;
      if(!s || !applySettings(s)) { showToast(t('toastBadFormat')); return; }
      if(isFinite(numOr(s.lat, NaN)) && isFinite(numOr(s.lon, NaN)))
        focusEpicenter(Number(s.lat), Number(s.lon), s.name || '');
      showToast(t('toastLoaded'));
    };
    rd.readAsText(f);
    fileInput.value = '';
  });
  if(btnHelp) btnHelp.addEventListener('click', function() {
    /* Help is now in the "More" tab, so this button is deprecated */
  });

  function isTyping(e) {
    var t = e.target;
    return !!(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable));
  }
  document.addEventListener('keydown', function(e) {
    if(e.ctrlKey || e.metaKey || e.altKey || isTyping(e)) return;
    if(!window.vm || !window.vm.runtime) return;
    var launchEl = document.getElementById('launch');
    if(launchEl && !launchEl.hidden) return;
    var k = e.key;
    if(k === 'Escape') return;
    if(k === 'Enter') { e.preventDefault(); restart(); return; }
    if(k === 'c' || k === 'C') {
      e.preventDefault();
      if(panel.classList.contains('visible')) hidePanel(); else showPanel();
      return;
    }
    if(k === '1' || k === '2' || k === '3') { e.preventDefault(); setVar(VID.tab, parseInt(k, 10)); return; }
  });

  function maybeShowHelp() {
    if(helpChecked) return;
    var ls = document.getElementById('launch');
    if(ls && !ls.hidden) return;
    helpChecked = true;
    var seen = false;
    try { seen = localStorage.getItem(HELP_KEY) === '1'; } catch(e) {}
    if(seen) return;
    showHelp();
    try { localStorage.setItem(HELP_KEY, '1'); } catch(e) {}
  }

  function init() {
    var retries = 0;
    var maxRetries = 100; // 最多重試 30 秒
    var checkInterval = setInterval(function() {
      retries++;
      
      // 檢查 vm 是否準備好
      if(window.vm && window.vm.runtime && window.vm.runtime.targets && window.vm.runtime.targets.length >= 2) {
        clearInterval(checkInterval);
        
        try {
          showPanel();
          applyLang();
          pullVars();
          applyVolume();
          
          var urlSettings = settingsFromUrl();
          if(urlSettings && applySettings(urlSettings)) {
            if(isFinite(urlSettings.lat) && isFinite(urlSettings.lon))
              focusEpicenter(urlSettings.lat, urlSettings.lon, urlSettings.name);
            showToast(t('toastUrlApplied'));
          }
          
          updateEEWOverlay();
          setInterval(function(){
            hideMonitors(); pullVars(); fixJMA(); updateEEWOverlay(); applyVolume();
            holdEpicenter();
          }, 200);
          window.addEventListener('resize', updateEEWOverlay);
          
          console.log('[EEW Sim] UI initialized successfully');
        } catch(e) {
          console.error('[EEW Sim] UI initialization error:', e);
          alert('UI 初始化失敗: ' + e.message);
        }
        return;
      }
      
      // 如果超時，顯示錯誤訊息
      if(retries >= maxRetries) {
        clearInterval(checkInterval);
        console.error('[EEW Sim] Failed to initialize: vm not ready after 30s');
        var errDiv = document.createElement('div');
        errDiv.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#ff4444;color:white;padding:20px;border-radius:8px;font-family:sans-serif;max-width:400px;text-align:center;z-index:9999;';
        errDiv.innerHTML = '<h3>載入失敗</h3><p>無法加載地震模擬器。<br>請檢查控制台 (F12) 的錯誤訊息。</p><p>常見原因：<br>- quake-sim-data.bin 找不到<br>- 網路問題</p>';
        document.body.appendChild(errDiv);
        return;
      }
    }, 300);
    
    // 同時監控 vm 是否出現
    var vmCheck = setInterval(function() {
      if(window.vm) {
        clearInterval(vmCheck);
        console.log('[EEW Sim] VM detected, waiting for runtime...');
      }
    }, 100);
  }

  new MutationObserver(hideMonitors).observe(document.body, {childList:true, subtree:true});
  setTimeout(init, 500); // 稍微延遲等待 VM 加載
})();
</script>
</body>
</html>
